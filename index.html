<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAIA Android · Web Preview</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><h1>NAIA <span>Web Preview</span></h1><p>모바일 우선 프롬프트 편집기 · 로컬 미리보기</p></header>
<section class="panel"><label for="main">메인 프롬프트</label><textarea id="main" rows="5">1girl, __pose__</textarea>
<label for="rule">조건부 규칙</label><textarea id="rule" rows="3">(*standing):prefix+=__face__</textarea>
<div class="actions"><button id="preview">프롬프트 미리보기</button><button id="copy" class="secondary">결과 복사</button></div>
<p id="status" role="status">준비됨</p></section>
<section class="panel"><h2>와일드카드 TXT</h2><input id="files" type="file" accept=".txt,text/plain" multiple><div id="loaded">기본 샘플: pose, face</div></section>
<section class="panel"><h2>출력</h2><pre id="result" aria-live="polite">아직 실행하지 않았습니다.</pre></section>
<footer>현재 웹 미리보기는 제한된 JS 엔진입니다. NAIA 원본 Python 엔진과의 완전한 호환성을 보장하지 않습니다.</footer></main><script src="app.js"></script></body></html>
